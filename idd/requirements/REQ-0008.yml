uid: REQ-0008
type: requirement
status: proposed
title: A summary per item and per person
text: summarise gives, per item, who created it, when, its type, origin, status,
  signers and its standing after the last commit (met, what is still missing, the
  signatures held), and, per person, the roles they signed in and how many items
  they created, amended, signed and withdrew a signature from. Signatures sharing
  an identifier are one person, named by the last name used.
normative: true
