uid: INT-0001
type: intent
status: proposed
title: See how a repository's throughline graphs came to be, every register's items
  and every link, under their own signing rules, from git alone
text: 'A throughline graph''s history is in git already, and so is a repository''s
  set of graphs. This package reads it into events and tallies. For each graph: every
  item in every register, whatever its type, and every link, as each was created,
  changed, moved status, linked, unlinked, renumbered and removed; each signature
  with who gave it, under what identifier and in what role, when, and what it supersedes,
  and each withdrawal; every item judged at every commit by the signing rules the
  graph''s configuration declared then, so it says when an item''s signatures came
  to meet what its kind requires and when they stopped, when an amendment left a
  signature covering wording no longer there, and when the rules changed; and counts
  by status, node type and link type after every commit. Across a repository''s graphs:
  when each was born and removed, the registers, node types and link types each declares,
  the sources each draws on, whether a sibling graph or another repository at a ref,
  how its links reach into them, and the lineage a graph records in its own configuration,
  and only that: nothing is inferred from order, comments or composition. It also
  sets several people''s independent signings of the same items beside each other
  and beside what was finally kept, saying whether each attempt''s signatures would
  meet the rules. It is the reader behind history.iddn.uk and learn.iddn.uk, and
  runs in the reader''s own browser tab, so no server sees a token or a graph.'
rationale: 'Decided with the operator on 2026-10-25: a package of its own, importing
  throughline as a library and run under Pyodide through browser-core, not a tl verb
  and not an estate service; nothing is added to a graph or its configuration and
  nothing is committed.'
normative: false
